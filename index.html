<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spellblade Hockey</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0f1224; overflow: hidden; }

    position: fixed; inset: 0;
    background-color: #0f1224;
    background-image: linear-gradient(#141833 1px, transparent 1px), linear-gradient(90deg, #141833 1px, transparent 1px);
    background-size: 8px 8px;
    font-family: 'Press Start 2P', monospace; color: #7f8bb5;
  }

  }
  #fs {
    position: fixed; right: 8px; bottom: 8px; z-index: 5; opacity: .45;
    font: 8px 'Press Start 2P', monospace; color: #e4f7ff; background: #14182b;

  #fs:hover { opacity: 1; }
</style>
</head>
<body>
<canvas id="c" width="480" height="300" tabindex="0"></canvas>
<div id="fs" title="Toggle fullscreen (F)">[F] FULLSCREEN</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Show any error on screen so it can be reported/fixed */
window.addEventListener('error', function (e) {
  try {
    var d = document.getElementById('errbox');
    if (!d) {
      d = document.createElement('div'); d.id = 'errbox';
      d.style.cssText = 'position:fixed;left:0;right:0;top:0;padding:10px;background:#d62839;color:#fff;font:12px/16px monospace;z-index:99;white-space:pre-wrap';
      document.body.appendChild(d);
    }
    d.textContent += 'ERROR: ' + (e.message || 'unknown') + ' (line ' + e.lineno + ')\n';
  } catch (x) {}
});
</script>
<script>
(() => {
'use strict';

/* =====================================================================
   SPELLBLADE HOCKEY  -  8/16-bit pixel hockey with spells
   Internal resolution 480x300, scaled up with nearest-neighbour.
   ===================================================================== */

const W = 480, H = 300;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* Scale the game to fill as much of the window as the 16:10 aspect allows. */
function resize() {
  const vw = window.innerWidth || document.documentElement.clientWidth || W;
  const vh = window.innerHeight || document.documentElement.clientHeight || H;
  const sc = Math.max(0.5, Math.min(vw / W, vh / H));
  cv.style.width = Math.floor(W * sc) + 'px';
  cv.style.height = Math.floor(H * sc) + 'px';
}
addEventListener('resize', resize); resize();
addEventListener('orientationchange', resize);
document.addEventListener('fullscreenchange', () => { resize(); setTimeout(resize, 150); });
function toggleFullscreen() {
  try {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  } catch (err) {}
}
const fsBtn = document.getElementById('fs');
if (fsBtn) fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFullscreen(); try { cv.focus(); } catch (x) {} });

  ['8px', '16px', '24px', '32px'].forEach(s => document.fonts.load(s + ' "Press Start 2P"').catch(() => {}));
}

/* ---------- constants ---------- */
const L = 14, R = 466, T = 36, B = 292, CY = (T + B) / 2;
const MOUTH = 28, NET_D = 12, CORNER = 30;
const STEP = 1 / 120;
const PR = 6.5, BR = 4, BL = 15;
const MAXV = 120, TURN = 15;
// stick-control tuning
const SNAP_R = 25, SNAP_V = 230;                       // magnet radius (px) and the fastest loose puck a stick can still gather
const CHARGE_T = 0.8, SHOT_MIN = 170, SHOT_MAX = 320;  // seconds to a full charge; shot speed range (px/s)
const DEKE_T = 0.26, DEKE_V = 205;                     // side-step length and speed
const SPIN_T = 0.55;                                   // Spin-O-Rama duration
const GR = 7, GV = 58;
const FIRE_V = 440, FIRE_RANGE = 48, MANA_TIME = 7, MATCH_TIME = 90;
const SCORE_LIMIT = 5, RES_READY = 1.4;      // first to 5 goals wins early; results buttons unlock after 1.4s (so spell-mashing can't skip the stats)
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- audio (tiny WebAudio chiptune) ---------- */
let AC = null, muted = false;
const lastSfx = {};
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', v = 0.05, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);

  o.start(t); o.stop(t + d + 0.03);
}
function sfx(n) {
  if (NET.role === 'host' && NET.inMatch && n !== 'ready') NET.ev.push(['s', n]);
  const now = performance.now();
  if (lastSfx[n] && now - lastSfx[n] < 45) return;
  lastSfx[n] = now;
  switch (n) {
    case 'hit':   tone(200, .06, 'square', .05, 110); break;
    case 'stick': tone(340, .04, 'square', .04, 200); break;
    case 'board': tone(140, .06, 'triangle', .08, 85); break;
    case 'fire':  tone(180, .45, 'sawtooth', .06, 1000); tone(90, .4, 'square', .04, 320); break;
    case 'ice':   tone(1200, .18, 'triangle', .06, 1900); tone(900, .25, 'triangle', .05, 600, .06); break;
    case 'melt':  tone(700, .3, 'sawtooth', .04, 90); break;
    case 'shatter': tone(1500, .12, 'triangle', .04, 400); break;
    case 'tick':  tone(440, .09, 'square', .05); break;
    case 'whistle': tone(1400, .35, 'sine', .06, 1550); tone(1300, .25, 'sine', .04, 1400, .1); break;
    case 'deny':  tone(130, .16, 'square', .05, 80); break;
    case 'ready': tone(660, .06, 'square', .04); tone(990, .1, 'square', .04, null, .07); break;
    case 'goal':  [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, .16, 'square', .06, null, i * .11)); break;
    case 'over':  [784, 659, 523, 392].forEach((f, i) => tone(f, .22, 'square', .06, null, i * .17)); break;
    case 'clone': tone(300, .25, 'sawtooth', .05, 80); tone(900, .2, 'triangle', .04, 300, .05); break;
    case 'poof':  tone(240, .18, 'sawtooth', .04, 60); break;
    case 'shield': tone(523, .12, 'triangle', .06, 1046); tone(784, .3, 'triangle', .05, 1568, .08); break;
    case 'potion': tone(500, .12, 'sine', .05, 200); tone(260, .22, 'square', .03, 120, .08); break;
    case 'slip':  tone(900, .25, 'sine', .04, 250); break;
    case 'snap':  tone(700, .05, 'square', .03, 1100); break;
    case 'shot':  tone(260, .09, 'square', .05, 120); break;
    case 'slap':  tone(160, .18, 'sawtooth', .07, 60); tone(900, .08, 'square', .04, 300); break;
    case 'deke':  tone(500, .09, 'triangle', .05, 1000); break;
    case 'spin':  tone(300, .2, 'square', .04, 900); tone(900, .25, 'triangle', .04, 300, .12); break;
    case 'whoosh': tone(600, .1, 'sine', .03, 200); break;
    case 'ach':   [660, 880, 1100, 1320].forEach((f, i) => tone(f, .12, 'square', .05, null, i * .09)); tone(1760, .3, 'triangle', .04, 2200, .38); break;
    case 'level': [523, 659, 784, 1046].forEach((f, i) => tone(f, .14, 'square', .06, null, i * .08)); tone(1568, .35, 'triangle', .05, 1976, .34); break;
    case 'vs':    tone(110, .35, 'sawtooth', .07, 55); tone(330, .2, 'square', .05, 660, .12); tone(660, .3, 'square', .05, 990, .3); break;

}

/* ---------- input ---------- */
const K = {};

/* ---------- customisable controls ---------- */
const ACTIONS = [['u', 'MOVE UP'], ['d', 'MOVE DOWN'], ['l', 'MOVE LEFT'], ['r', 'MOVE RIGHT'],
                 ['sp', 'SPELL'], ['s', 'SHOOT (HOLD)'], ['sk', 'SKILL 2X=SPIN']];
const DEFAULT_KEYS = [
  { u: 'KeyW', d: 'KeyS', l: 'KeyA', r: 'KeyD', sp: 'Space', s: 'KeyE', sk: 'KeyQ' },
  { u: 'ArrowUp', d: 'ArrowDown', l: 'ArrowLeft', r: 'ArrowRight', sp: 'Enter', s: 'Slash', sk: 'Period' }
];
const BIND = [Object.assign({}, DEFAULT_KEYS[0]), Object.assign({}, DEFAULT_KEYS[1])];   // live bindings (players hold these objects)
const KEY_STORE = 'spellblade_keys_v1';
function isReserved(c) { return !c || c === 'Escape' || c === 'Tab' || c === 'KeyP' || c === 'KeyM' || c === 'KeyF' || c === 'Unidentified' || c === 'ContextMenu' || /^F\d+$/.test(c) || /^Meta/.test(c); }
const isMouseCode = c => /^Mouse\d$/.test(c);
function validBinds(B) {
  const owns = [false, false];
  for (let i = 0; i < 2; i++) ACTIONS.forEach((a, r) => { if (isMouseCode(B[i][a[0]])) { if (r < 4) owns[i] = null; else if (owns[i] !== null) owns[i] = true; } });
  return owns[0] !== null && owns[1] !== null && !(owns[0] && owns[1]);
}
function isBound(c) { return BIND.some(b => ACTIONS.some(a => b[a[0]] === c)); }
function saveKeys() { try { localStorage.setItem(KEY_STORE, JSON.stringify(BIND)); } catch (e) {} }
function loadKeys() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY_STORE) || 'null');
    if (!d || d.length !== 2) return;
    const seen = {};
    for (let i = 0; i < 2; i++) for (const a of ACTIONS) {
      const v = d[i] && d[i][a[0]];
      if (typeof v !== 'string' || isReserved(v) || seen[v]) return;     // anything odd: keep the defaults
      seen[v] = 1;
    }
    if (!validBinds(d)) return;
    for (let i = 0; i < 2; i++) for (const a of ACTIONS) BIND[i][a[0]] = d[i][a[0]];
  } catch (e) {}
}
function resetKeys() {
  Object.assign(BIND[0], DEFAULT_KEYS[0]); Object.assign(BIND[1], DEFAULT_KEYS[1]);
  try { localStorage.removeItem(KEY_STORE); } catch (e) {}
}
function toast(msg) { S.toast = msg; S.toastUntil = S.t + 2; }
// give `code` to one action; whoever had that key gets the key this action used to have (no duplicates, ever)
function bindKey(col, row, code) {
  if (isReserved(code)) { toast('RESERVED KEY - TRY ANOTHER'); sfx('deny'); return false; }
  const act = ACTIONS[row][0], old = BIND[col][act];
  if (old === code) { toast('KEY UNCHANGED'); return true; }
  const trial = BIND.map(b => Object.assign({}, b));
  let swapped = '';
  for (let i = 0; i < 2; i++) for (const a of ACTIONS) {
    if (trial[i][a[0]] === code && !(i === col && a[0] === act)) { trial[i][a[0]] = old; swapped = ' (SWAPPED)'; }
  }
  trial[col][act] = code;
  if (!validBinds(trial)) {                       // mouse buttons: spell/shoot/skill only, and only one player
    toast(isMouseCode(code) && row < 4 ? 'MOUSE: SPELL, SHOOT OR SKILL ONLY' : 'MOUSE BUTTONS: ONE PLAYER ONLY');
    sfx('deny'); return false;
  }
  BIND[0] = Object.assign(BIND[0], trial[0]); BIND[1] = Object.assign(BIND[1], trial[1]); saveKeys();
  toast(ACTIONS[row][1].split(' (')[0] + ' = ' + keyLabel(code) + swapped); sfx('ready');
  return true;
}
function keyLabel(c) {
  if (isMouseCode(c)) return ['L CLICK', 'M CLICK', 'R CLICK', 'MOUSE 4', 'MOUSE 5'][+c.slice(5)] || 'MOUSE ' + (+c.slice(5) + 1);
  if (/^Key[A-Z]$/.test(c)) return c.slice(3);
  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^Numpad\d$/.test(c)) return 'NUM ' + c.slice(6);
  const m = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', Space: 'SPACE', Enter: 'ENTER', NumpadEnter: 'ENTER',
    Slash: '/', Period: '.', Comma: ',', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']', Backslash: '\\', Minus: '-', Equal: '=', Backquote: '`',
    ShiftLeft: 'L SHIFT', ShiftRight: 'R SHIFT', ControlLeft: 'L CTRL', ControlRight: 'R CTRL', AltLeft: 'L ALT', AltRight: 'R ALT',
    Backspace: 'BKSPACE', CapsLock: 'CAPS', NumpadAdd: 'NUM +', NumpadSubtract: 'NUM -', NumpadMultiply: 'NUM *', NumpadDivide: 'NUM /', NumpadDecimal: 'NUM .' };
  return m[c] || c.toUpperCase().slice(0, 9);
}
function keyShort(c) { if (isMouseCode(c)) return ['LCLK', 'MCLK', 'RCLK', 'M4', 'M5'][+c.slice(5)] || 'MOUSE'; return keyLabel(c).replace(' SHIFT', 'SH').replace(' CTRL', 'CT').replace(' ALT', 'AL').slice(0, 5); }
function moveLabel(k) {
  if (k.u === 'ArrowUp' && k.d === 'ArrowDown' && k.l === 'ArrowLeft' && k.r === 'ArrowRight') return 'ARROWS';
  const l = [k.u, k.l, k.d, k.r].map(keyLabel);
  return l.every(x => x.length === 1) ? l.join('') : 'CUSTOM';
}
loadKeys();
function keyName(e) {
  if (e.code && e.code !== 'Unidentified') return e.code === 'NumpadEnter' ? 'Enter' : e.code;
  const k = e.key || '';
  const map = { ' ': 'Space', 'Spacebar': 'Space', 'Enter': 'Enter', 'Escape': 'Escape',
                'ArrowUp': 'ArrowUp', 'ArrowDown': 'ArrowDown', 'ArrowLeft': 'ArrowLeft', 'ArrowRight': 'ArrowRight' };
  if (map[k]) return map[k];
  if (k.length === 1 && /[a-z]/i.test(k)) return 'Key' + k.toUpperCase();
  if (/^[0-9]$/.test(k)) return 'Digit' + k;
  const kc = { 32: 'Space', 13: 'Enter', 27: 'Escape', 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown' }[e.keyCode];
  return kc || k;
}
addEventListener('keydown', e => {
  const c = keyName(e);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Tab', 'Slash', 'Period'].includes(c) || isBound(c) || (S.rebind && !/^F\d+$/.test(c))) e.preventDefault();
  try { initAudio(); } catch (err) {}
  if (e.repeat) { K[c] = true; return; }
  K[c] = true;
  netInputKick();                       // guest: tell the host about the new key state right now, not at the next tick
  onPress(c);
});
addEventListener('keyup', e => { K[keyName(e)] = false; netInputKick(); });
/* click / tap the game to focus it and start (helps in embedded previews) */
cv.addEventListener('pointerdown', e => {
  try { cv.focus(); initAudio(); } catch (err) {}
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const mcode = 'Mouse' + e.button;
  if (S.mode === 'title' && S.tab === 2 && S.rebind) {      // waiting for a new binding: a mouse button counts
    const rb = S.rebind; S.rebind = null; bindKey(rb.col, rb.row, mcode); return;
  }
  if (S.mode === 'play') {                                  // bound mouse buttons act exactly like bound keys
    if (isBound(mcode)) { K[mcode] = true; netInputKick(); onPress(mcode); }
    return;
  }
  if (e.button !== 0) return;                               // menus: left click only
  if (S.mode === 'lobby') { lobbyClick(x, y); return; }
  if (S.mode === 'title') {
    if (y < 26) { tabClick(x, y); return; }
    if (S.tab === 3) { achClick(x, y); return; }
    if (S.tab === 2) { controlsClick(x, y); return; }
    if (S.tab === 1) { fighterClick(x, y); return; }
    for (let i = 0; i < 3; i++) {
      if (y >= 106 + 14 * i && y < 120 + 14 * i && x > 60 && x < 420) { S.menuRow = i; changeRow(1); return; }
    }
    if (y >= 152 && y < 170) { if (x > 250) openLobby(); else startGame(); }
  } else if (S.mode === 'intro') { if (S.introT > 0.5) skipIntro(); }
  else if (S.mode === 'over') {
    if (S.t - S.overAt >= RES_READY) { const i = btnAt(x, y); if (i === 0) rematch(); else if (i === 1) toMenu(); }
  }
});
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  S.mx = (e.clientX - r.left) * W / r.width; S.my = (e.clientY - r.top) * H / r.height;
  if (S.mode === 'over') {
    const i = btnAt(S.mx, S.my);
    if (i >= 0) S.resSel = i;
    cv.style.cursor = i >= 0 ? 'pointer' : 'default';
  } else if (S.mode === 'title' && S.tab === 2) {
    const h = controlsHit(S.mx, S.my);
    if (h && !S.rebind) S.cSel = h;
    cv.style.cursor = (S.my < 26 || h) ? 'pointer' : 'default';
  } else if (S.mode === 'title') cv.style.cursor = (S.my < 26 || S.my > 150) ? 'pointer' : 'default';
  else cv.style.cursor = 'default';
});
addEventListener('pointerup', e => { K['Mouse' + e.button] = false; netInputKick(); });
addEventListener('pointercancel', () => { for (let i = 0; i < 5; i++) K['Mouse' + i] = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { if (S.mode === 'title' && S.tab === 3) { e.preventDefault(); achScroll(e.deltaY > 0 ? 1 : -1); } }, { passive: false });
['mousedown', 'mouseup', 'auxclick'].forEach(n => cv.addEventListener(n, e => { if (e.button > 0) e.preventDefault(); }));   // no autoscroll / back / forward
addEventListener('blur', () => { for (const k in K) K[k] = false; if (S.mode === 'play') togglePause(); });
addEventListener('paste', e => {
  if (S.mode !== 'lobby' || !S.lob || S.lob.st !== 'joining') return;
  const t = ((e.clipboardData && e.clipboardData.getData('text')) || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^SPELLBLADEHOCKEY/, '');
  S.lob.code = (S.lob.code + t).split('').filter(ch => NET_ALPHA.includes(ch)).join('').slice(0, 5);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') togglePause(); });

/* ---------- pixel helpers ---------- */
function insideRink(x, y, inset = 0) {
  const l = L + inset, r = R - inset, t = T + inset, b = B - inset, c = Math.max(0, CORNER - inset);
  if (x < l || x > r || y < t || y > b) return false;
  const cx = x < l + c ? l + c : x > r - c ? r - c : x;
  const cy = y < t + c ? t + c : y > b - c ? b - c : y;

function pxRoundRect(g, x, y, w, h, r, color) {

    else if (yy + 0.5 > h - r) dy = (yy + 0.5) - (h - r);

}

  g.fillStyle = color;
  const R0 = r + 1;

    const d = Math.sqrt(x * x + y * y);

/* ---------- pre-rendered rink ---------- */
let seed = 20261026;
const srnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

function buildRink() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;

}

/* ---------- per-frame update ---------- */
function auraParticle(p) {

    case 0: spawn(hx + rnd(-1, 1), hy, rnd(-6, 6), rnd(-26, -12), rnd(0.25, 0.45), rnd(2, 3), FIRE_COLS); break;
    case 1: spawn(hx + rnd(-3, 3), hy + rnd(-2, 3), rnd(-8, 8), rnd(2, 12), rnd(0.4, 0.7), 2, ICE_COLS); break;
    case 2: spawn(p.x + rnd(-5, 5), p.y + rnd(-6, 6), rnd(-6, 6), rnd(-10, 0), rnd(0.3, 0.55), 2, ['#a67cff', '#6a3fb5', '#2a1650']); break;
    case 3: spawn(hx + rnd(-4, 4), hy + rnd(-2, 4), rnd(-4, 4), rnd(-16, -6), rnd(0.35, 0.6), 2, GOLD_COLS); break;
    default: spawn(hx + rnd(-4, 4), hy + rnd(-1, 3), rnd(-5, 5), rnd(-20, -8), rnd(0.4, 0.7), 2, ['#d2ffd8', '#7be08a', '#2f9e55']);

}
function ambient(dt) {

    if (p.oil > 0 && Math.random() < dt * 24) spawn(p.x + rnd(-6, 6), p.y + rnd(0, 7), rnd(-10, 10), rnd(-6, 6), 0.35, 2, OIL_COLS);
    if (p.dekeT > 0 && Math.random() < dt * 60) spawn(p.x + rnd(-4, 4), p.y + rnd(-6, 6), -p.dkx * 20, -p.dky * 20, 0.25, 2, ['#ffffff', '#c9e8f3', '#8fd3ff']);
    if (p.spinT > 0 && Math.random() < dt * 60) spawn(p.bx + rnd(-1, 1), p.by + rnd(-1, 1), rnd(-8, 8), rnd(-8, 8), 0.3, 2, GOLD_COLS);
    if (p.charge >= 0.999 && Math.random() < dt * 20) spawn(p.bx + rnd(-3, 3), p.by + rnd(-3, 3), rnd(-12, 12), rnd(-18, -4), 0.3, 2, GOLD_COLS);
    if (p.stun > 0 && Math.random() < dt * 25) spawn(p.x + rnd(-6, 6), p.y - 10, rnd(-10, 10), rnd(-30, -10), 0.4, 2, ['#ffd23f', '#ffffff']);
  });
  G.forEach(g => {
    if (g.stun > 0 && Math.random() < dt * 25) spawn(g.x + rnd(-6, 6), g.y - 10, rnd(-10, 10), rnd(-30, -10), 0.4, 2, ['#ffd23f', '#ffffff']);

}
// fireball trail: ~180 embers a second regardless of frame rate (stochastic rounding keeps 144 Hz and 60 Hz identical on average)
function trail(dt) {
  let n = 180 * dt; n = Math.floor(n) + (Math.random() < n - Math.floor(n) ? 1 : 0);
  for (let i = 0; i < n; i++) spawn(puck.x + rnd(-2, 2), puck.y + rnd(-2, 2), -puck.vx * 0.04 + rnd(-14, 14), rnd(-24, -4), rnd(0.25, 0.5), rnd(3, 6), FIRE_COLS);
}
function liveUpdate(dt) {
  for (const w of walls) {
    w.t -= dt; w.age += dt;
    if (!w.dead && Math.random() < dt * 8) spawn(w.x + rnd(0, w.w), w.y + rnd(0, w.h), rnd(-8, 8), rnd(-14, -4), 0.5, 2, ICE_COLS);
    if (!w.dead && w.t <= 0) { w.dead = true; shatterWall(w, false); }
  }
  walls = walls.filter(w => !w.dead);
  if (puck.fire) trail(dt);

  for (let i = decoys.length - 1; i >= 0; i--) {
    const d = decoys[i];
    d.age += dt; d.t -= dt;
    const f = Math.exp(-0.12 * dt); d.vx *= f; d.vy *= f;
    d.x += d.vx * dt; d.y += d.vy * dt;
    keepInRink(d, 3, 1);
    if (Math.random() < dt * 30) spawn(d.x + rnd(-2, 2), d.y + rnd(-2, 2), rnd(-10, 10), rnd(-14, 0), 0.5, rnd(2, 4), SMOKE_COLS);
    const g = G.find(gg => gg.team !== d.owner);

      gone = true; g.stun = Math.max(g.stun, 0.7); S.shake = Math.max(S.shake, 3);
      addText('FOOLED!', g.x + (g.team ? -26 : 26), g.y - 14, '#c9a6ff'); unlock('mind', d.owner);

  }

    for (const p of P) {

      const ex = (p.x - q.x) / q.r, ey = (p.y - q.y) / (q.r * 0.75);
      if (ex * ex + ey * ey < 1.15) {
        if (p.oil <= 0) { p.slipDir = Math.random() < 0.5 ? -1 : 1; addText('SLIP!', p.x, p.y - 16, '#7be08a'); sfx('slip'); stat(q.owner, 'slips'); }

}
function update(dt) {
  updateCore(dt);
  if (NET.role === 'host' && NET.inMatch) hostTick(dt);
}
function updateCore(dt) {
  S.t += dt;
  updateToasts();
  S.shake = Math.max(0, S.shake - 28 * dt);
  S.flash = Math.max(0, S.flash - dt);
  if (S.mode === 'paused') return;
  P.forEach(p => { p.noPuck = Math.max(0, p.noPuck - dt); });
  puck.ignT = Math.max(0, puck.ignT - dt);
  S.goBanner = Math.max(0, S.goBanner - dt);
  const m = S.mode;
  if (NET.role === 'guest' && NET.inMatch) { guestTick(dt); updateParticles(dt); return; }

  if (m === 'title' || m === 'over' || m === 'lobby') {
    G.forEach(g => stepGoalie(g, dt));
    ambient(dt);
  } else if (m === 'intro') {
    S.introT += dt;
    if (S.introT >= 3.6) skipIntro();
  } else if (m === 'countdown') {
    const prev = Math.ceil(S.cd / 0.8);
    S.cd -= dt;
    G.forEach(g => stepGoalie(g, dt));
    const cur = Math.ceil(S.cd / 0.8);
    if (cur !== prev && cur > 0) sfx('tick');
    ambient(dt);
    if (S.cd <= 0) { S.mode = 'play'; S.goBanner = 0.8; sfx('whistle'); }
  } else if (m === 'play' || m === 'goal') {
    if (S.mode === 'play') P.forEach(p => { if (p.cpu) aiThink(p, dt); });
    acc += dt;
    while (acc >= STEP) { physStep(STEP, S.mode === 'play'); acc -= STEP; }
    liveUpdate(dt);
    checkAchievements();
    ambient(dt);
    if (S.mode === 'play') {
      if (!S.ot) S.time -= dt; else S.otT += dt;
      P.forEach(p => {
        p.mana = Math.min(1, p.mana + dt / MANA_TIME * regenMul(CH[p.char]));
        if (p.mana >= 0.999 && !p.wasFull) { p.wasFull = true; if (isMe(p.id)) sfx('ready'); else if (NET.role === 'host') NET.ev.push(['s', 'ready']); }
      });
      if (!S.ot && S.time <= 0) {
        S.time = 0; sfx('whistle');
        if (S.score[0] === S.score[1]) {
          S.ot = true; S.otT = 0; resetPositions(); S.mode = 'countdown'; S.cd = 2.4;
        } else endGame();
      } else if (S.ot && S.otT >= 30) { sfx('whistle'); endGame(); }   // sudden death times out as a draw
    } else if (S.mode === 'goal') {
      S.goalT -= dt;
      if (S.goalT <= 0) {
        if (S.ot || S.time <= 0 || Math.max(S.score[0], S.score[1]) >= SCORE_LIMIT) endGame();
        else { resetPositions(); S.mode = 'countdown'; S.cd = 2.4; }
      }
    }
  }
  updateParticles(dt);
}

/* ---------- rendering ---------- */
function drawStick(p) {
  // Side-view hockey stick: long wooden shaft down to the ice, then a flat blade
  // kicked out in the direction the skater faces, with white tape and a team-coloured knob.
  const d = p.face < 0 ? -1 : 1;
  const hx = Math.round(p.x + d * 3), hy = Math.round(p.y + 1);          // top hand
  const bx = Math.round(p.bx), by = Math.round(p.by);                    // blade contact point
  const heelX = bx - d * 2, toeX = bx + d * 3;
  const OUT = '#14182b';

  // shaft outline, then wood
  [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(o => pxLine(hx + o[0], hy + o[1], heelX + o[0], by + o[1], OUT));
  pxLine(hx, hy, heelX, by, '#d9a05b');
  pxLine(hx + d, hy, heelX + d, by, '#a8703a');                          // shaded edge for thickness

  // blade: dark outline, graphite body, white tape
  const x0 = Math.min(heelX, toeX), w = Math.abs(toeX - heelX) + 1;
  ctx.fillStyle = OUT; ctx.fillRect(x0 - 1, by, w + 2, 4);
  ctx.fillStyle = '#f4f1e8'; ctx.fillRect(x0, by + 1, w, 1);            // white tape on top edge
  ctx.fillStyle = '#4a5078'; ctx.fillRect(x0, by + 2, w, 1);             // graphite blade face
  ctx.fillStyle = OUT; ctx.fillRect(heelX - d, by - 1, 1, 1);            // heel corner joins the shaft

  // butt-end knob in team colour
  ctx.fillStyle = OUT; ctx.fillRect(hx - 2, hy - 2, 4, 3);
  ctx.fillStyle = p.id ? '#8fd3ff' : '#ff7a59'; ctx.fillRect(hx - 1, hy - 1, 2, 1);
}
function drawShield(p) {
  if (p.shield <= 0) return;

  const x = Math.round(p.x), y = Math.round(p.y) - 2;

  pxRing(ctx, x, y, 11, 1.2, '#ffd23f');
  pxRing(ctx, x, y, 12, 0.5, '#fff3a0', (px, py) => ((px + py) & 1) === 0);
  const a = S.t * 3;
  ctx.fillStyle = '#ffffff';
  for (let k = 0; k < 4; k++) {
    const sx = Math.round(x + Math.cos(a + k * Math.PI / 2) * 11), sy = Math.round(y + Math.sin(a + k * Math.PI / 2) * 11);
    ctx.fillRect(sx - 1, sy, 3, 1); ctx.fillRect(sx, sy - 1, 1, 3);

    ctx.globalAlpha = 0.28; blit(spr, Math.round(x - 5 - p.vx * 0.06), Math.round(y - 9 - p.vy * 0.06), p.face < 0);
    ctx.globalAlpha = 0.14; blit(spr, Math.round(x - 5 - p.vx * 0.12), Math.round(y - 9 - p.vy * 0.12), p.face < 0);

  ctx.fillStyle = '#0b0d1a'; ctx.fillRect(bx, by, bw, 14);
  ctx.fillStyle = '#2b3158'; ctx.fillRect(bx + 2, by + 2, bw - 4, 10);
  ctx.fillStyle = flash && blink ? '#ffffff' : '#ffd23f'; ctx.fillRect(bx + 2, by + 2, Math.round((bw - 4) * frac), 10);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(bx + 2, by + 2, Math.round((bw - 4) * frac), 2);
  txt(li.need ? Math.floor(li.into) + ' / ' + li.need : 'MAX LEVEL', bx + bw / 2, by + 3, 8, '#ffffff', 'center', '#14182b');
  txt('+' + r.gain + ' XP', 444, 226, 8, '#7be08a', 'right');
}
function drawResults() {
  const t = S.t - S.overAt;
  ctx.fillStyle = 'rgba(11,13,26,.9)'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(0, Math.round((1 - easeOut(t / 0.35)) * -300));       // slides down from the top
  const win = S.winner;
  const col = win < 0 ? '#ffd23f' : (win === 0 ? '#d62839' : '#2a6fdb');
  const blink = Math.floor(S.t * 3) % 2;

  // pixel box: dark outline, gold frame, panel
  ctx.fillStyle = '#0b0d1a'; ctx.fillRect(20, 6, 440, 288);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(22, 8, 436, 284);
  ctx.fillStyle = '#14182b'; ctx.fillRect(25, 11, 430, 278);
  ctx.fillStyle = col; ctx.fillRect(25, 11, 430, 28);
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(25, 11, 430, 2);
  txt('FULL TIME', 240, 17, 16, '#ffffff', 'center', '#14182b');
  txt(S.endReason || '', 240, 44, 8, '#ffd23f', 'center');

  // final score
  const sb = (id, x) => {
    const c = CH[S.chars[id]], team = id ? '#2a6fdb' : '#d62839';
    const tag = NET.role ? (id === NET.me ? 'YOU' : 'OPP') : S.cpu ? (id === S.cpuId ? 'CPU' : 'YOU') : 'P' + (id + 1);
    ctx.fillStyle = win === id ? '#ffd23f' : '#0b0d1a'; ctx.fillRect(x - 3, 55, 174, 60);
    ctx.fillStyle = '#0b0d1a'; ctx.fillRect(x - 1, 57, 170, 56);
    ctx.fillStyle = team; ctx.fillRect(x, 58, 168, 54);
    blit(SPR[S.chars[id]][id][0], x + 8, 64, id === 1, 3);
    txt(String(S.score[id]), x + 118, 72, 32, '#ffffff', 'center', '#14182b');
    txt(tag + ' ' + c.name, x + 84, 120, 8, '#e4f7ff', 'center');
  };
  sb(0, 36); sb(1, 276);
  txt('-', 240, 72, 32, '#7f8bb5', 'center');
  if (win < 0) txt('DRAW GAME', 240, 132, 8, blink ? '#ffd23f' : '#ffffff', 'center');
  else txt('WINNER!', win ? 360 : 120, 132, 8, blink ? '#ffd23f' : '#ffffff', 'center');

  // match stats
  const rows = [
    ['SHOTS / ON GOAL', s => s.shots + ' / ' + s.onGoal, s => s.shots],
    ['GOALS', s => s.goals, s => s.goals],
    ['SAVES', s => s.saves, s => s.saves],
    ['SPELLS CAST', s => s.spells, s => s.spells],
    ['HITS / CHECKS', s => s.hits, s => s.hits]
  ];
  rows.forEach((r, i) => {
    if (t < 0.4 + 0.12 * i) return;                                  // rows reveal one by one
    const y = 147 + 12 * i;
    ctx.fillStyle = i % 2 ? '#181d36' : '#1d2342'; ctx.fillRect(36, y - 2, 408, 11);
    const a = r[2](stats[0]), b = r[2](stats[1]);
    txt(String(r[1](stats[0])), 120, y, 8, a > b ? '#ffd23f' : '#e4f7ff', 'center');
    txt(r[0], 240, y, 8, '#b8c4ee', 'center');
    txt(String(r[1](stats[1])), 360, y, 8, b > a ? '#ffd23f' : '#e4f7ff', 'center');
  });

  drawXpBlock(t, blink);

  // buttons
  const ready = t >= RES_READY;
  RES_BTN.forEach((b, i) => {
    const sel = S.resSel === i;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = '#0b0d1a'; ctx.fillRect(b.x + 3, b.y + 4, b.w, b.h);
    ctx.fillStyle = '#14182b'; ctx.fillRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
    ctx.fillStyle = sel ? '#ffd23f' : '#3a4175'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = sel ? '#fff3a0' : '#5a63a0'; ctx.fillRect(b.x, b.y, b.w, 3); ctx.fillRect(b.x, b.y, 3, b.h);
    ctx.fillStyle = sel ? '#c9a227' : '#262b52'; ctx.fillRect(b.x, b.y + b.h - 3, b.w, 3); ctx.fillRect(b.x + b.w - 3, b.y, 3, b.h);
    txt(b.label, b.x + b.w / 2, b.y + 8, 8, sel ? '#14182b' : '#e4f7ff', 'center', sel ? null : '#14182b');
    if (sel && ready) { txt('>', b.x + 10, b.y + 8, 8, '#14182b', 'left', null); txt('<', b.x + b.w - 18, b.y + 8, 8, '#14182b', 'left', null); }
    ctx.globalAlpha = 1;
  });
  if (NET.role === 'guest') txt(NET.rem ? 'WAITING FOR HOST TO START REMATCH...' : 'R = ASK FOR A REMATCH   ESC = LEAVE', 240, 278, 8, NET.rem ? '#ffd23f' : '#5b6590', 'center');
  else if (NET.role) txt(S.remReq ? 'OPPONENT WANTS A REMATCH! PRESS R' : 'R REMATCH   ESC = LEAVE', 240, 278, 8, S.remReq ? (blink ? '#ffd23f' : '#ffffff') : '#5b6590', 'center');
  else txt('R REMATCH  ESC MENU  C CHANGE FIGHTERS', 240, 278, 8, '#5b6590', 'center');
  ctx.restore();
}
// how-to-play strip (shown during the face-off countdown and on the pause screen)
function drawControls(y) {
  const L1 = keyLabel;
  if (S.cpu || NET.role) {
    const a = BIND[0], b = BIND[1];
    txt(('MOVE: ' + moveLabel(a) + ' OR ' + moveLabel(b) + '   SPELL: ' + L1(a.sp) + ' OR ' + L1(b.sp)).slice(0, 58), 240, y, 8, '#e4f7ff', 'center');
    txt(('HOLD ' + L1(a.s) + ' OR ' + L1(b.s) + ' TO CHARGE - RELEASE TO SHOOT').slice(0, 58), 240, y + 12, 8, '#ffd23f', 'center');
    txt((L1(a.sk) + ' OR ' + L1(b.sk) + ' = DEKE   TAP TWICE = SPIN-O-RAMA').slice(0, 58), 240, y + 24, 8, '#8fd3ff', 'center');
  } else {
    [[0, 120, '#ff7a59'], [1, 360, '#8fd3ff']].forEach(r => {
      const k = BIND[r[0]];
      txt(('P' + (r[0] + 1) + ' ' + moveLabel(k) + ' MOVE').slice(0, 29), r[1], y, 8, r[2], 'center');
      txt((L1(k.sp) + ' = SPELL').slice(0, 29), r[1], y + 10, 8, '#e4f7ff', 'center');
      txt(('HOLD ' + L1(k.s) + ' = CHARGE SHOT').slice(0, 29), r[1], y + 20, 8, '#ffd23f', 'center');
      txt((L1(k.sk) + ' DEKE, 2X = SPIN').slice(0, 29), r[1], y + 30, 8, '#e4f7ff', 'center');
    });
  }
}
function drawOverlays() {
  const m = S.mode;
  if (m === 'title') { drawTitle(); return; }
  if (m === 'lobby') { drawLobby(); return; }
  if (m === 'countdown') {
    const n = Math.ceil(S.cd / 0.8);
    if (n >= 1 && n <= 3) {
      const col = ['#ffd23f', '#ffb100', '#ff5a1f'][n - 1];
      txt(String(n), 240, 126, 32, col, 'center', '#14182b');
    }
    if (S.ot) txt('SUDDEN DEATH', 240, 96, 16, '#ff5a5f', 'center');
    else if (S.score[0] + S.score[1] === 0 && S.time === MATCH_TIME) {
      txt('FACE OFF!', 240, 96, 16, '#ffffff', 'center');
      txt('FIRST TO ' + SCORE_LIMIT + ' WINS', 240, 116, 8, '#ffb100', 'center');
    }
    ctx.fillStyle = 'rgba(11,13,26,.72)'; ctx.fillRect(10, 224, 460, 64);
    drawControls(230);
  }
  if (m === 'play' && S.goBanner > 0) txt('GO!', 240, 122, 32, '#ffd23f', 'center');
  if (m === 'goal') {
    const col = S.goalBy ? '#5aa9ff' : '#ff5a5f';
    const flick = Math.floor(S.t * 10) % 2;
    txt('GOAL!', 240, 108, 32, flick ? '#ffffff' : col, 'center', '#14182b');
    txt(S.goalBy ? 'BLUE SCORES' : 'RED SCORES', 240, 150, 8, col, 'center');
  }
  if (m === 'paused') {
    ctx.fillStyle = 'rgba(11,13,26,.75)'; ctx.fillRect(0, 32, W, H - 32);
    txt('PAUSED', 240, 120, 24, '#ffd23f', 'center');
    txt('PRESS P TO RESUME', 240, 160, 8, '#e4f7ff', 'center');
    txt('PRESS Q TO QUIT TO MENU', 240, 178, 8, '#7f8bb5', 'center');
    drawControls(214);
  }
  if (m === 'over') drawResults();
}

function render() {
  if (S.mode === 'intro') { drawIntro(); return; }
  ctx.fillStyle = '#0f1224'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (S.shake > 0.5) ctx.translate(Math.round(rnd(-S.shake, S.shake)), Math.round(rnd(-S.shake, S.shake)));
  ctx.drawImage(rinkLayer, 0, 0);
  puddles.forEach(drawPuddle);
  walls.forEach(drawWall);
  [G[0], G[1], P[0], P[1]].sort((a, b) => a.y - b.y).forEach(e => e.kind === 'g' ? drawGoalie(e) : drawPlayer(e));
  if (S.mode !== 'title' && S.mode !== 'lobby') drawPuck();
  decoys.forEach(drawDecoy);
  drawParticles();
  ctx.restore();
  if (S.mode !== 'title' && S.mode !== 'lobby') drawHUD();
  drawOverlays();
  drawToast();
  if (S.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.6, S.flash * 2.2) + ')'; ctx.fillRect(0, 32, W, H - 32); }
}

/* ---------- main loop ---------- */
resetPositions();
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
